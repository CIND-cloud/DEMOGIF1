<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Accounting Demo - CIND</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
            overflow: hidden;
        }

        body * {
            box-sizing: border-box;
        }

        .cind-demo-wrapper {
            background-color: #FFCC00; 
            background-image: radial-gradient(circle at center, #FFE55C 0%, #FFCC00 70%);
            padding: 30px; 
            border-radius: 36px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .cind-demo-card {
            background-color: #FFF9E6;
            border: 4px solid #D4AF37;
            border-radius: 24px; 
            padding: 40px 50px; 
            text-align: center;
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.1);
            position: relative;
            overflow: hidden;
            width: 600px;
            z-index: 1;
        }

        .cind-demo-subtitle {
            color: #8B6508;
            letter-spacing: 5px;
            font-size: 12px;
            margin-bottom: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .cind-demo-title {
            color: #4A3B1B;
            font-size: 46px; 
            margin: 0 0 20px 0;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.2;
            font-family: 'Georgia', serif;
        }
        
        .cind-demo-title span {
            font-style: italic;
            color: #333333;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.6); 
        }

        .cind-demo-title .cind-demo-prefix {
            font-size: 0.55em;
            font-weight: 600;
            letter-spacing: 3px;
            color: #555555; 
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
            opacity: 0.9; 
            font-style: normal;
        }

        .cind-demo-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .cind-demo-divider::before, .cind-demo-divider::after {
            content: "";
            height: 2px;
            width: 50px;
            background: linear-gradient(90deg, transparent, #D4AF37, transparent);
            margin: 0 15px;
        }

        .cind-demo-coin {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #FFF3C4 0%, #FFCC00 50%, #D4AF37 100%);
            border: 2px solid #8B6508;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #4A3B1B;
            font-weight: 900;
            font-size: 15px;
            box-shadow: 0 3px 6px rgba(139, 101, 8, 0.3), inset 0 2px 3px rgba(255, 255, 255, 0.8);
        }

        .cind-demo-description {
            color: #5C4A2B;
            font-size: 16px; 
            margin-bottom: 30px; 
            line-height: 1.6;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 600;
        }

        .cind-demo-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #FFCC00; 
            background-image: linear-gradient(180deg, #FFF3C4 0%, #FFCC00 50%, #D4AF37 100%);
            color: #3E2A0C; 
            font-size: 22px; 
            font-weight: 900;
            letter-spacing: 2px;
            padding: 14px 50px;
