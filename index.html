<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>Accounting Demo - Full Perfect Version</title>
<style>
    /* ===== 基礎設定：上下留窄邊，左右保持 ===== */
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #FFCC00; 
        background-image: radial-gradient(circle at center, #FFE55C 0%, #FFCC00 70%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 15px 40px; /* 上下留 15px 窄邊 */
        box-sizing: border-box;
    }

    /* ===== 卡片設計 ===== */
    .card {
        background-color: #FFF9E6;
        border: 4px solid #D4AF37;
        border-radius: 24px; 
        padding: 40px 50px; 
        text-align: center;
        box-shadow: 
            0 15px 30px rgba(184, 134, 11, 0.25),
            0 0 0 8px rgba(255, 255, 255, 0.4),
            inset 0 0 20px rgba(212, 175, 55, 0.1);
        position: relative;
        overflow: hidden;
        max-width: 600px; 
        width: 100%;
        z-index: 1;
    }

    /* ===== 頂部小字 ===== */
    .subtitle {
        color: #8B6508;
        letter-spacing: 5px;
        font-size: 12px;
        margin-bottom: 10px;
        font-weight: 800;
        text-transform: uppercase;
    }

    /* ===== 主標題 ===== */
    .title {
        color: #4A3B1B;
        font-size: 46px; 
        margin: 0 0 20px 0;
        font-weight: 900;
        letter-spacing: 1px;
        line-height: 1.2;
        font-family: 'Georgia', serif;
    }
    
    /* ACCOUNTING 字體設定：斜體 + 純灰黑 */
    .title span {
        font-style: italic;
        color: #333333;
        text-shadow: 1px 1px 0px rgba(255,255,255,0.6); 
    }

    /* LEVEL UP YOUR 統一用斜體 */
    .title .prefix {
        font-size: 0.55em;
        font-weight: 600;
        letter-spacing: 3px;
        color: #555555; 
        text-transform: uppercase;
        display: block;
        margin-bottom: 6px;
        opacity: 0.9; 
    }

    /* ===== 分隔線 ===== */
    .divider {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        color: #B8860B;
        font-size: 18px;
        font-weight: bold;
    }
    
    .divider::before, .divider::after {
        content: "";
        height: 2px;
        width: 50px;
        background: linear-gradient(90deg, transparent, #D4AF37, transparent);
        margin: 0 15px;
    }

    /* ===== 描述文字 ===== */
    .description {
        color: #5C4A2B;
        font-size: 16px; 
        margin-bottom: 30px; 
        line-height: 1.5;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
        font-weight: 600;
    }

    /* ===== 高質感按鈕 ===== */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #FFCC00; 
        background-image: linear-gradient(180deg, #FFF3C4 0%, #FFCC00 50%, #D4AF37 100%);
        color: #3E2A0C; 
        font-size: 22px; 
        font-weight: 900;
        letter-spacing: 2px;
        padding: 14px 50px; 
        border-radius: 60px;
        text-decoration: none;
        position: relative;
        border: 3px solid #C49A2D; 
        cursor: pointer;
        overflow: hidden; 
        
        box-shadow: 
            0 10px 0 #8B6508, 
            0 20px 25px rgba(139, 101, 8, 0.4),
            inset 0 -4px 0 rgba(139, 101, 8, 0.2),
            inset 0 3px 0 rgba(255, 255, 255, 0.7); 
        
        animation: strongBounce 1.5s infinite ease-in-out alternate;
        margin-bottom: 25px; 
    }

    /* 🎯 實體反光層：保證錄影軟件 100% 捉得到 */
    .btn-shine {
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
        transform: skewX(-25deg);
        animation: shine 3s infinite; 
        pointer-events: none; /* 唔會阻擋滑鼠點擊 */
    }

    /* 按鈕內部的播放圖標 */
    .play-icon {
        background-color: #4A3B1B;
        color: #FFCC00; 
        border-radius: 50%;
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-right: 12px;
        font-size: 14px;
        padding-left: 2px;
        
        animation: iconPulse 1.5s infinite alternate;
        box-shadow: inset 0 0 10px rgba(255, 204, 0, 0.3);
    }

    /* ===== 底層資訊 ===== */
    .legal-note {
        color: #A08C5A;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 8px;
        text-transform: uppercase;
    }
    
    /* Producer 聲明 */
    .produced-by {
        color: #8B6508;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-top: 5px;
        opacity: 0.8;
    }

    /* ===== 動畫定義 ===== */
    @keyframes strongBounce {
        0% {
            transform: translateY(0) scale(1);
            box-shadow: 
                0 10px 0 #8B6508, 
                0 15px 15px rgba(139, 101, 8, 0.4),
                inset 0 -4px 0 rgba(139, 101, 8, 0.2),
                inset 0 3px 0 rgba(255, 255, 255, 0.7),
                0 0 10px rgba(255, 204, 0, 0.2);
        }
        100% {
            transform: translateY(-12px) scale(1.08); 
            box-shadow: 
                0 22px 0 #8B6508, 
                0 30px 35px rgba(139, 101, 8, 0.5),
                inset 0 -4px 0 rgba(139, 101, 8, 0.2),
                inset 0 3px 0 rgba(255, 255, 255, 0.9),
                0 0 30px rgba(255, 204, 0, 0.8); 
        }
    }

    @keyframes shine {
        0% { left: -100%; }
        20% { left: 100%; } 
        100% { left: 100%; } 
    }

    @keyframes iconPulse {
        0% { transform: scale(1); box-shadow: inset 0 0 10px rgba(255, 204, 0, 0.2); }
        100% { transform: scale(1.15); box-shadow: inset 0 0 20px rgba(255, 204, 0, 0.6); }
    }
</style>
</head>
<body>

<div class="card">
    <div class="subtitle">EXPERIENCE THE NEO-GAME UI</div>
    
    <h1 class="title">
        <span class="prefix">Level Up Your</span>
        <span>ACCOUNTING</span>
    </h1>
    
    <div class="divider">💰</div>
    
    <div class="description">Manage your numbers, grow your business, and experience our accounting system. Try the demo today!</div>
    
    <div class="btn">
        <!-- 🎯 實體反光層加咗入嚟 -->
        <div class="btn-shine"></div>
        <span class="play-icon">▶</span> TRY OUR DEMO
    </div>

    <div class="legal-note">Built for real businesses. 100% Local Privacy.</div>
    <div class="produced-by">Produced by CIND Accounting</div>
    
</div>

</body>
</html>
